<div class="min-h-screen bg-slate-100 text-slate-800">
  <header class="bg-white border-b border-slate-200">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
      <div class="flex items-center gap-6">
        <span class="text-lg font-semibold text-indigo-600">Leave&nbsp;Requests</span>
        <nav class="flex items-center gap-1">
          @for (item of navItems; track item.path) {
            <span *appHasPermission="item.permission">
              <a
                [routerLink]="item.path"
                routerLinkActive="bg-indigo-50 text-indigo-700"
                class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
              >
                {{ item.label }}
              </a>
            </span>
          }
        </nav>
      </div>

      <div class="flex items-center gap-3">
        @if (auth.user(); as user) {
          <div class="text-right leading-tight">
            <div class="text-sm font-semibold">{{ user.name }}</div>
            <div class="text-xs text-slate-500">{{ user.roles.join(' · ') }}</div>
          </div>
          <span
            class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-600 text-sm font-semibold text-white"
          >
            {{ initials() }}
          </span>
          <button
            type="button"
            (click)="signOut()"
            class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
          >
            Sign out
          </button>
        }
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">
    <router-outlet />
  </main>
</div>
